add_newline = true

format = """
[╭─](bold blue)$os$username$hostname$directory$git_branch$git_status$fill$time
[╰─>](bold blue) $character
"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[✖](bold red)"

[os]
style = "bold blue"
format = "[$symbol](bold blue) "

[os.symbols]
Ubuntu = " "

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)@"

[hostname]
ssh_only = false
style = "bold yellow"
format = "[$hostname]($style) "

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bold magenta"
format = "[\\($branch\\)]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"

[fill]
symbol = " "

[time]
disabled = false
style = "bold white"
format = "[$time]($style)"
