[bootstrap.packages]
"apt:virtualbox" = "latest"
"apt:virtualbox-ext-pack" = "latest"
"apt:vagrant" = "latest"
"apt:dkms" = "latest"

[tasks."setup:virtualbox-user"]
description = "Ajoute l'utilisateur courant au groupe vboxusers"
run = '''
set -eu
u="$(id -un)"
if ! id -nG "$u" | tr ' ' '\n' | grep -qx 'vboxusers'; then
  sudo usermod -aG vboxusers "$u"
fi

echo "L'utilisateur $u est maintenant dans le groupe vboxusers."
'''

[tasks."setup:virtualbox"]
description = "Vérifie que VirtualBox et Vagrant sont bien installés et accessibles"
depends = ["setup:virtualbox-user"]
run = '''
set -eu
VBoxManage --version
vagrant --version
'''
