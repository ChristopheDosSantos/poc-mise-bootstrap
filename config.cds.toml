[tools]
rust = "latest"
go = "latest"
typst = "latest"
starship = "latest"
"http:jetbrains-toolbox" = { version = "3.8.1.88030", url = "https://download.jetbrains.com/toolbox/jetbrains-toolbox-{{version}}.tar.gz", strip_components = 1, bin_path = "bin" }

[bootstrap.packages]
"apt:fontconfig" = "latest"
"apt:unzip" = "latest"
"apt:libfuse2t64" = "latest"
"apt:flatpak" = "latest"
"apt:libnss3-tools" = "latest"   # fournit certutil
"apt:openssl" = "latest"

[tasks."setup:font"]
description = "FiraCode Nerd Font (utilisateur courant)"
run = '''
set -eu
if fc-list | grep -qi 'FiraCode Nerd Font'; then
  echo "FiraCode Nerd Font déjà installée"
  exit 0
fi

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT
curl -fsSL -o "$tmp/FiraCode.zip" \
  https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FiraCode.zip

dest="$HOME/.local/share/fonts/FiraCodeNerdFont"
mkdir -p "$dest"
unzip -oq "$tmp/FiraCode.zip" '*.ttf' -d "$dest"
fc-cache -f
'''

[tasks."setup:shell"]
description = "Active mise (profil cds) et Starship dans .bashrc"
run = '''
set -eu
touch "$HOME/.bashrc"

grep -q 'mise activate' "$HOME/.bashrc" || \
  printf '%s\n' "eval \"\$($(command -v mise) activate bash)\"" >> "$HOME/.bashrc"

# MISE_ENV doit être défini AVANT la ligne mise activate
grep -q 'MISE_ENV=docker,cds' "$HOME/.bashrc" || \
  sed -i '/mise activate/i export MISE_ENV=docker,cds' "$HOME/.bashrc"

grep -q 'starship init bash' "$HOME/.bashrc" || \
  printf '%s\n' '# Starship prompt' 'eval "$(starship init bash)"' >> "$HOME/.bashrc"
'''

[tasks."setup:flatpak-apps"]
description = "Applications Flatpak (utilisateur)"
run = '''
set -eu
flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

for app in \
  org.mozilla.firefox \
  org.chromium.Chromium \
  com.vscodium.codium
do
  flatpak info --user "$app" >/dev/null 2>&1 || \
    flatpak install --user -y flathub "$app"
done
'''

[tasks."setup:codium-typst"]
description = "Extension Tinymist (Typst) pour VSCodium"
depends = ["setup:flatpak-apps"]
run = '''
set -eu
ext="myriad-dreamin.tinymist"

if flatpak run com.vscodium.codium --list-extensions | grep -qix "$ext"; then
  echo "Extension $ext déjà installée"
else
  flatpak run com.vscodium.codium --install-extension "$ext"
fi
'''

[tasks."setup:certs-local"]
depends = ["setup:flatpak-apps"]
description = "Certificats internes (PEM) dans ~/.local/share/dinum-certs"
run = '''
set -eu
url="https://cert.gouv.nc/certs.json"
dest="$HOME/.local/share/dinum-certs"

tmp="$(mktemp -d)"
trap 'rm -rf "$tmp"' EXIT

curl -fsSL "$url" -o "$tmp/certs.json"
base="$(jq -r '.base_url' "$tmp/certs.json")"

for f in $(jq -r '.files[]' "$tmp/certs.json"); do
  curl -fsSL "${base%/}/$f" -o "$tmp/$f.raw"
  if openssl x509 -in "$tmp/$f.raw" -noout 2>/dev/null; then
    cp "$tmp/$f.raw" "$tmp/${f%.*}.crt"
  else
    openssl x509 -inform DER -in "$tmp/$f.raw" -out "$tmp/${f%.*}.crt"
  fi
done
ls "$tmp"/*.crt >/dev/null

rm -rf "$dest"
mkdir -p "$dest"
cp "$tmp"/*.crt "$dest"/
'''

[tasks."setup:certs-firefox"]
description = "Firefox (Flatpak) : installe les certificats internes par politique"
depends = ["setup:certs-local"]
run = '''
set -eu
certs="$HOME/.local/share/dinum-certs"
arch="$(flatpak --default-arch)"
dir="$HOME/.local/share/flatpak/extension/org.mozilla.firefox.systemconfig/$arch/stable/policies"

mkdir -p "$dir"
jq -n '{policies: {Certificates: {Install: $ARGS.positional}}}' \
  --args "$certs"/*.crt > "$dir/policies.json"

# le bac à sable doit pouvoir lire les fichiers référencés par la politique
flatpak override --user --filesystem="$certs:ro" org.mozilla.firefox
'''

[tasks."setup:certs-chromium"]
description = "Chromium (Flatpak) : importe les certificats internes dans la base NSS"
depends = ["setup:certs-local"]
run = '''
set -eu
app="org.chromium.Chromium"
certs="$HOME/.local/share/dinum-certs"
db="$HOME/.var/app/$app/.pki/nssdb"

# Le bac à sable doit persister ~/.pki, sinon Chromium ne lit pas cette base
flatpak override --user --persist=.pki "$app"

mkdir -p "$db"
[ -f "$db/cert9.db" ] || certutil -d "sql:$db" -N --empty-password

for c in "$certs"/*.crt; do
  n="$(basename "${c%.crt}")"
  certutil -d "sql:$db" -D -n "$n" 2>/dev/null || true
  certutil -d "sql:$db" -A -t "C,," -n "$n" -i "$c"
done

certutil -d "sql:$db" -L
'''