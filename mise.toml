[bootstrap.packages]
"apt:docker.io" = "latest"

[vars.dev_user]
required = "Renseigner dev_user (mise vars dev_user=alice)"
prompt = "Utilisateur à ajouter au groupe docker"

[tasks.bootstrap]
run = '''
set -eu
id {{ vars.dev_user | quote }} >/dev/null
sudo usermod -aG docker {{ vars.dev_user | quote }}
'''