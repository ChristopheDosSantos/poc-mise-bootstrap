[tools]
rust = "stable"
go = "1.23.2"
node = "lts"
typst = "latest"

[tasks.bootstrap]
run = '''
set -eu

# Logiciels gérés par mise.
mise install

export PATH="$HOME/.local/bin:$PATH"
export PATH="$HOME/.cargo/bin:$PATH"
export PATH="$HOME/.local/go/bin:$PATH"
export PATH="$HOME/go/bin:$PATH"

# Node/Yarn via Corepack (sans sudo, compatible avec la gestion de versions de mise).
if command -v node >/dev/null 2>&1; then
  corepack enable >/dev/null 2>&1 || true
  corepack prepare yarn@stable --activate >/dev/null 2>&1 || true
fi

# Chemins locaux utilisateur.
[ -f "$HOME/.bashrc" ] || touch "$HOME/.bashrc"
if ! grep -q 'export PATH="$HOME/.local/bin:$PATH"' "$HOME/.bashrc"; then
  printf '%s\n' 'export PATH="$HOME/.local/bin:$PATH"' >> "$HOME/.bashrc"
fi

# Firefox et Chromium installés localement, sans sudo.
if ! command -v firefox >/dev/null 2>&1 && [ ! -x "$HOME/.local/firefox/firefox" ]; then
  tmp_dir="$(mktemp -d)"
  trap 'rm -rf "$tmp_dir"' EXIT

  curl -fsSL -o "$tmp_dir/firefox.tar.bz2" \
    'https://download.mozilla.org/?product=firefox-latest-ssl&os=linux64&lang=en-US'

  rm -rf "$HOME/.local/firefox"
  tar -xjf "$tmp_dir/firefox.tar.bz2" -C "$HOME/.local"

  if [ -x "$HOME/.local/firefox/firefox" ]; then
    ln -sf "$HOME/.local/firefox/firefox" "$HOME/.local/bin/firefox"
  fi
fi

if ! command -v chromium >/dev/null 2>&1 && [ ! -x "$HOME/.local/chromium/usr/bin/chromium" ]; then
  if command -v dpkg-deb >/dev/null 2>&1; then
    tmp_dir="$(mktemp -d)"
    trap 'rm -rf "$tmp_dir"' EXIT

    chromium_url="$(python3 - <<'PY'
import json, urllib.request
url = 'https://api.github.com/repos/ungoogled-software/ungoogled-chromium-binaries/releases/latest'
with urllib.request.urlopen(url, timeout=30) as r:
    data = json.load(r)
for asset in data.get('assets', []):
    name = asset.get('name', '')
    if name.startswith('chromium_') and name.endswith('_amd64.deb'):
        print(asset['browser_download_url'])
        break
PY
)"

    if [ -n "$chromium_url" ]; then
      curl -fsSL -o "$tmp_dir/chromium.deb" "$chromium_url"
      rm -rf "$HOME/.local/chromium"
      mkdir -p "$HOME/.local/chromium"
      dpkg-deb -x "$tmp_dir/chromium.deb" "$HOME/.local/chromium"

      if [ -x "$HOME/.local/chromium/usr/bin/chromium" ]; then
        ln -sf "$HOME/.local/chromium/usr/bin/chromium" "$HOME/.local/bin/chromium"
      fi
    fi
  fi
fi

# Starship.
if ! command -v starship >/dev/null 2>&1; then
  curl -fsSL https://starship.rs/install.sh | sh -s -- -y
fi

# Police JetBrains Mono Nerd Font.
font_dir="$HOME/.local/share/fonts"
mkdir -p "$font_dir"
if ! command -v fc-list >/dev/null 2>&1 || ! fc-list | grep -qi 'JetBrainsMono Nerd Font'; then
  tmp_dir="$(mktemp -d)"
  trap 'rm -rf "$tmp_dir"' EXIT

  curl -fsSL -o "$tmp_dir/JetBrainsMono.zip" \
    https://github.com/ryanoasis/nerd-fonts/releases/latest/download/JetBrainsMono.zip

  unzip -q "$tmp_dir/JetBrainsMono.zip" -d "$font_dir"

  if command -v fc-cache >/dev/null 2>&1; then
    fc-cache -fv
  fi
fi

# JetBrains Toolbox.
if ! command -v jetbrains-toolbox >/dev/null 2>&1; then
  toolbox_version='3.8.1.88030'
  toolbox_dir="$HOME/.local/share/JetBrains/Toolbox"
  toolbox_bin="$toolbox_dir/bin/jetbrains-toolbox"

  mkdir -p "$HOME/.local/bin" "$HOME/.local/share/JetBrains"

  if [ ! -x "$toolbox_bin" ]; then
    tmp_dir="$(mktemp -d)"
    trap 'rm -rf "$tmp_dir"' EXIT

    curl -fsSL -o "$tmp_dir/jetbrains-toolbox.tar.gz" \
      "https://download.jetbrains.com/toolbox/jetbrains-toolbox-$toolbox_version.tar.gz"

    rm -rf "$toolbox_dir"
    mkdir -p "$toolbox_dir"
    tar -xzf "$tmp_dir/jetbrains-toolbox.tar.gz" -C "$toolbox_dir" --strip-components=1
  fi

  if [ -x "$toolbox_bin" ]; then
    ln -sf "$toolbox_bin" "$HOME/.local/bin/jetbrains-toolbox"
  fi
fi

# Fichier de config Starship stocké dans le dépôt source.
if [ -f "$PWD/config/starship.toml" ]; then
  mkdir -p "$HOME/.config"
  install -m 0644 "$PWD/config/starship.toml" "$HOME/.config/starship.toml"
fi

# Activation du prompt.
if ! grep -q 'starship init bash' "$HOME/.bashrc"; then
  printf '%s\n' '# Starship prompt' >> "$HOME/.bashrc"
  printf '%s\n' 'eval "$(starship init bash)"' >> "$HOME/.bashrc"
fi

starship --version
rustc --version
go version
node --version
yarn --version
firefox --version
chromium --version
typst --version
'''
